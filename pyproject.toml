[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-dag-orchestrator"
version = "0.8.0"
description = "Multi-model Hierarchical DAG Concurrent Orchestrator with HITL, Budget Guard, Semantic Cache, and Disk-Backed Streaming."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
multimodal-dag = "quickstart:main"
